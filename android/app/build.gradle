plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lesnayafeya.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lesnayafeya.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

// Keep the web prototype as the single source of truth and copy it into Android assets on every build.
tasks.register('syncGameAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'assets/**'
    }
    into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild').configure {
    dependsOn 'syncGameAssets'
}
